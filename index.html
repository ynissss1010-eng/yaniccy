<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天</title>
<style>
:root{
  --green:#07c160;
  --bg:#ededed;
  --line:#e6e6e6;
  --blue:#576b95;
  --text:#181818;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
              "Microsoft YaHei",sans-serif;
  background:#d9d9d9;color:var(--text);
  display:flex;justify-content:center;
}
button,input,textarea,select{font:inherit}
button{
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  color:inherit;
}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{
  width:100%;max-width:480px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);
  position:relative;overflow:hidden;
}
header{
  height:52px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;
  position:relative;border-bottom:1px solid #d9d9d9;
  background:var(--bg);z-index:3;
}
header h1{font-size:17px;font-weight:600}
.head-btn{
  position:absolute;top:0;width:48px;height:52px;
  display:flex;align-items:center;justify-content:center;
  border:0;background:none;
}
.head-btn.left{left:0}
.head-btn.right{right:0}
svg.ico{
  width:25px;height:25px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  flex-shrink:0;
}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.view.wechat{background:#fff}
.view.contacts{background:var(--bg)}
.view.chat{padding:12px;background:var(--bg)}
.view.moments{background:#fff}
.avatar{
  width:40px;height:40px;border-radius:5px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  color:white;background:#7c9cbf;overflow:hidden;font-size:18px;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.self{background:#5b8c5a}
.contact{
  width:100%;border:0;background:#fff;display:flex;
  align-items:center;padding:12px 16px;text-align:left;
  position:relative;gap:12px;
}
.contact::after{
  content:"";position:absolute;left:76px;right:0;bottom:0;
  border-bottom:1px solid var(--line);
}
.contact:active,.menu-row:active{background:#ececec}
.contact.pinned{background:#f2f2f2}
.contact .avatar{width:48px;height:48px}
.contact-info{flex:1;min-width:0}
.contact-top{display:flex;align-items:center;gap:8px}
.contact-name{
  font-size:17px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;
}
.contact-time{font-size:11px;color:#b2b2b2;flex-shrink:0}
.preview{
  font-size:14px;color:#999;margin-top:5px;min-height:19px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.section-note{padding:10px 16px;font-size:12px;color:#888;line-height:1.6}
.contacts .contact .avatar{width:40px;height:40px}
.contacts .contact::after{left:68px}
.contacts .contact{padding:11px 16px}
.empty{text-align:center;padding:45px 20px;color:#999;font-size:14px}
.tabbar{
  display:flex;flex-shrink:0;background:#f7f7f7;
  border-top:1px solid #d6d6d6;
  padding:5px 0 max(5px,env(safe-area-inset-bottom));
}
.tab{
  flex:1;border:0;background:none;
  display:flex;flex-direction:column;align-items:center;
  gap:2px;color:#181818;font-size:10px;min-height:47px;
}
.tab svg{width:27px;height:27px}
.tab.on{color:var(--green)}
.tab.on .tab-fill{fill:currentColor;stroke:currentColor}
.menu-group{background:white;margin-bottom:8px}
.menu-row{
  border:0;background:white;width:100%;display:flex;
  align-items:center;text-align:left;gap:15px;
  padding:15px 16px;position:relative;min-height:55px;
}
.menu-row::after{
  content:"";position:absolute;left:57px;right:0;bottom:0;
  border-bottom:1px solid #eee;
}
.menu-row:last-child::after{display:none}
.menu-icon{
  width:25px;display:flex;align-items:center;justify-content:center;
}
.menu-name{flex:1;font-size:16px}
.chevron{font-size:24px;color:#b7b7b7;font-weight:300;line-height:1}
.profile-card{
  padding:39px 22px 30px;background:white;display:flex;
  align-items:center;gap:18px;min-height:160px;
  border:0;width:100%;text-align:left;
}
.profile-card .avatar{width:64px;height:64px;border-radius:9px;font-size:26px}
.profile-name{font-size:22px;font-weight:600;margin-bottom:10px}
.profile-id{font-size:14px;color:#888;word-break:break-all}
.profile-details{flex:1;min-width:0}
.profile-card .ico{width:19px;height:19px;color:#999}
.row{display:flex;align-items:flex-start;margin:14px 0}
.row.me{flex-direction:row-reverse}
.bubble{
  max-width:70%;padding:9px 12px;border-radius:5px;
  font-size:16px;line-height:1.5;margin:0 10px;
  background:white;position:relative;
  white-space:pre-wrap;word-break:break-word;
}
.bubble::before{
  content:"";position:absolute;top:13px;left:-6px;
  border-style:solid;border-width:6px 6px 6px 0;
  border-color:transparent white transparent transparent;
}
.row.me .bubble{background:#95ec69}
.row.me .bubble::before{
  left:auto;right:-6px;border-width:6px 0 6px 6px;
  border-color:transparent transparent transparent #95ec69;
}
.msg-time{text-align:center;color:#aaa;font-size:12px;margin:17px 0 7px}
.notice{text-align:center;color:#999;font-size:12px;margin:12px;line-height:1.7}
.error-note{color:#c44}
.msg-photo{
  max-width:65%;max-height:260px;object-fit:contain;
  border-radius:5px;margin:0 10px;cursor:pointer;
}
.photo-caption{font-size:13px;color:#777;margin:0 50px 12px;text-align:right}
.fake-photo{
  width:220px;max-width:70%;background:#dce4dd;
  border-radius:5px;padding:16px;color:#354c3a;
  margin:0 10px;font-size:14px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
}
.fake-photo small{display:block;color:#728576;margin-bottom:6px}
.transfer{
  width:224px;max-width:70%;background:#f7a048;
  color:white;border-radius:5px;margin:0 10px;position:relative;
}
.transfer::after{
  content:"";position:absolute;right:-6px;top:14px;
  border-left:6px solid #f7a048;
  border-top:6px solid transparent;border-bottom:6px solid transparent;
}
.transfer-main{display:flex;align-items:center;gap:12px;padding:16px 13px}
.transfer-main svg{width:33px;height:33px}
.transfer-money{font-size:21px}
.transfer-note{font-size:12px;line-height:1.5;margin-top:5px;word-break:break-word}
.transfer-foot{border-top:1px solid #ffffff40;padding:5px 12px;font-size:11px}
.voice-wrap{max-width:70%;margin:0 10px}
.voice-wrap .bubble{margin:0;max-width:100%}
.voice-btn{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;min-width:122px;border:0;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:pan-y;
}
.voice-btn .ico{width:21px;height:21px}
.row.me .voice-btn{flex-direction:row-reverse}
.row.me .voice-btn .ico{transform:rotate(180deg)}
.voice-label{font-size:13px;color:#444}
.voice-text{
  background:#fff;border-radius:5px;padding:8px 10px;
  margin-top:7px;white-space:pre-wrap;word-break:break-word;
  font-size:14px;line-height:1.6;
}
.voice-hint{font-size:10px;color:#aaa;margin-top:4px}
.voice-btn.playing svg{animation:voiceFlash .8s infinite}
@keyframes voiceFlash{50%{opacity:.3}}
#composer{
  flex-shrink:0;display:flex;gap:9px;align-items:center;
  padding:8px 10px max(8px,env(safe-area-inset-bottom));
  border-top:1px solid #d6d6d6;background:#f7f7f7;
}
.icon-btn{
  border:0;background:none;width:28px;height:34px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.icon-btn svg{width:27px;height:27px}
#input{
  flex:1;min-width:0;border:0;border-radius:5px;resize:none;
  background:white;padding:8px;font-size:16px;
  min-height:38px;max-height:120px;outline:none;line-height:22px;
}
#sendBtn{
  border:0;border-radius:5px;background:var(--green);color:white;
  padding:8px 12px;font-size:15px;flex-shrink:0;
}
#tray{
  flex-shrink:0;background:#f7f7f7;
  border-top:1px solid #ddd;max-height:260px;overflow:auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:22px 16px}
.tool{
  display:flex;flex-direction:column;gap:8px;align-items:center;
  border:0;background:none;color:#777;font-size:12px;
}
.tool-icon{
  background:white;width:58px;height:58px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:#222;
}
.tool-icon svg{width:29px;height:29px}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 8px}
.emoji-grid button{border:0;background:none;font-size:27px;min-height:39px}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:15px}
.sticker-grid button{border:0;background:white;border-radius:7px;min-height:65px;padding:5px}
.sticker-grid img{width:100%;height:65px;object-fit:contain}
.tray-tabs{display:flex;padding:6px 12px;gap:12px;border-top:1px solid #ddd}
.tray-tabs button{border:0;background:none;padding:6px;color:#666}
.tray-tabs button.on{color:var(--green)}
.cover{
  height:278px;background:linear-gradient(145deg,#4b6664,#a1b4a7);
  position:relative;background-position:center;background-size:cover;
  margin-bottom:46px;
}
.cover-change{
  position:absolute;left:13px;top:13px;border:0;border-radius:4px;
  background:#0004;color:white;padding:6px 10px;font-size:12px;
}
.cover-user{
  display:flex;align-items:center;gap:16px;position:absolute;
  right:18px;bottom:-25px;
}
.cover-name{
  color:white;font-size:19px;font-weight:600;
  text-shadow:0 1px 3px #0009;margin-bottom:24px;
}
.cover-user .avatar{
  width:70px;height:70px;border-radius:8px;border:2px solid white;
  font-size:28px;
}
.moment{display:flex;gap:10px;padding:18px 16px;border-bottom:1px solid #eee}
.moment-main{flex:1;min-width:0}
.moment-name{color:var(--blue);font-weight:600;font-size:15px;margin:0 0 7px}
.moment-text{font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.moment-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;margin-top:9px;max-width:300px;
}
.moment-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.moment-grid.single{display:block}
.moment-grid.single img{width:auto;max-width:100%;max-height:280px;aspect-ratio:auto}
.moment-meta{
  display:flex;align-items:center;gap:12px;
  margin-top:12px;color:#aaa;font-size:11px;
}
.moment-meta time{flex:1}
.text-btn{border:0;background:none;color:var(--blue);font-size:12px}
.moment-more{
  border:0;background:#f1f1f1;color:var(--blue);
  padding:0 7px;border-radius:3px;line-height:17px;font-weight:bold;
}
.moment-actions{
  margin:8px 0;display:flex;justify-content:flex-end;gap:1px;
}
.moment-actions button{
  background:#4b5053;color:white;border:0;
  padding:9px 16px;font-size:13px;
}
.moment-actions button:first-child{border-radius:4px 0 0 4px}
.moment-actions button:last-child{border-radius:0 4px 4px 0}
.interactions{
  background:#f3f3f5;border-radius:3px;margin-top:9px;
  font-size:13px;line-height:1.7;position:relative;
}
.interactions::before{
  content:"";position:absolute;top:-5px;left:12px;
  border-bottom:5px solid #f3f3f5;
  border-left:5px solid transparent;border-right:5px solid transparent;
}
.likes{color:var(--blue);padding:6px 9px}
.comments{padding:6px 9px;border-top:1px solid #e9e9e9}
.comments b{color:var(--blue);font-weight:500}
.comment-line{word-break:break-word}
.social-status{font-size:11px;color:#999;padding:0 16px 10px;line-height:1.6}
#modal{
  position:fixed;inset:0;background:#0006;z-index:20;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  width:100%;max-width:480px;max-height:90vh;max-height:90dvh;
  overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;
  padding:18px 16px max(20px,env(safe-area-inset-bottom));
}
.sheet-head{display:flex;align-items:center;margin-bottom:14px;gap:10px}
.sheet-head h2{font-size:17px;text-align:center;flex:1}
.sheet-close{background:none;border:0;font-size:23px;color:#777;padding:0 5px}
.sheet label{display:block;font-size:13px;color:#666;margin:12px 0}
.sheet input:not([type=checkbox]):not([type=range]),
.sheet textarea,.sheet select{
  display:block;width:100%;border:1px solid #e4e4e4;background:white;
  border-radius:6px;padding:10px;font-size:15px;margin-top:6px;outline:none;
}
.sheet textarea{resize:vertical}
.sheet input[type=range]{display:block;width:100%;margin-top:10px;accent-color:var(--green)}
.sheet input[type=checkbox]{accent-color:var(--green);margin-right:8px}
.sheet h3{font-size:14px;color:var(--green);margin:20px 0 9px}
.hint{font-size:12px;color:#888;line-height:1.8;margin:10px 0}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button,.wide-btn{
  border:0;border-radius:6px;padding:11px;background:white;font-size:15px;
}
.actions button{flex:1}
.primary{background:var(--green)!important;color:white}
.danger{color:#e64340}
.wide-btn{display:block;width:100%;margin-top:12px}
.upload-row{display:flex;gap:10px;align-items:center;margin:10px 0}
.upload-row button{
  border:1px solid #ddd;background:white;border-radius:5px;padding:7px 12px;font-size:13px;
}
.upload-preview{width:48px;height:48px;border-radius:5px;object-fit:cover;background:#ddd}
.upload-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.upload-images img{width:64px;height:64px;object-fit:cover;border-radius:4px}
.large-photo{display:block;max-width:100%;max-height:65vh;margin:auto;object-fit:contain}
.search-hit{
  display:block;width:100%;border:0;border-bottom:1px solid #eee;
  background:white;text-align:left;padding:12px;font-size:14px;
}
.search-hit small{display:block;color:#888;margin-bottom:6px}
.search-hit span{white-space:pre-wrap;word-break:break-word}
.highlight{animation:highlight 2s}
@keyframes highlight{0%,65%{background:#ffe4a0}100%{background:transparent}}
#toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#000c;color:white;padding:12px 16px;border-radius:8px;
  max-width: min(90vw,420px);font-size:13px;line-height:1.7;
  z-index:40;white-space:pre-wrap;pointer-events:none;
}
</style>
</head>
<body>
<div id="app">
  <header id="bar"></header>
  <main id="view" class="view"><div class="empty">正在读取本地记录…</div></main>
  <footer id="composer" hidden>
    <button class="icon-btn" id="voiceBtn" aria-label="发送语音"></button>
    <textarea id="input" rows="1" aria-label="消息"></textarea>
    <button class="icon-btn" id="emojiBtn" aria-label="表情"></button>
    <button id="sendBtn" hidden>发送</button>
    <button class="icon-btn" id="plusBtn" aria-label="更多功能"></button>
  </footer>
  <div id="tray" hidden></div>
  <nav id="tabs" class="tabbar" aria-label="主导航"></nav>
</div>
<div id="modal" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></section>
</div>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
/* ========= 小工具与微信风格图标 ========= */
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const uid = () => crypto.randomUUID
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);
const clone = value => JSON.parse(JSON.stringify(value));
const clamp = (v,min,max) => Math.min(max,Math.max(min,Number(v)||0));
const PATH = {
  back:'<path d="m15 4-8 8 8 8"/>',
  more:'<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M7 12h10m-5-5v10"/>',
  chat:'<path class="tab-fill" d="M14.8 13.5c-1.2 2-3.6 3.3-6.3 3.3-.8 0-1.6-.1-2.3-.3L3.1 18l.8-3.1A6.5 6.5 0 0 1 1.6 10c0-3.7 3.4-6.5 7.6-6.5 3.7 0 6.8 2.2 7.5 5.2"/><path d="M22.3 14.3c0 3-2.7 5.3-6 5.3-.7 0-1.4-.1-2-.3l-2.5 1.3.6-2.4a4.9 4.9 0 0 1-2.1-3.9c0-3 2.7-5.3 6-5.3s6 2.3 6 5.3Z"/><circle cx="6.3" cy="8.7" r=".6"/><circle cx="11.4" cy="8.7" r=".6"/><circle cx="14.5" cy="13.5" r=".5"/><circle cx="18.6" cy="13.5" r=".5"/>',
  contacts:'<rect x="3" y="3" width="17" height="18" rx="2"/><path d="M1 7h3m-3 5h3m-3 5h3m17-10h2m-2 5h2m-2 5h2"/><circle cx="11.5" cy="9" r="2.6"/><path d="M6.7 17c.5-3.8 9.1-3.8 9.6 0"/>',
  discover:'<circle cx="12" cy="12" r="9.5"/><path class="tab-fill" d="m16.3 7.7-2.6 6-6 2.6 2.6-6Z"/>',
  me:'<circle cx="12" cy="7.4" r="4.2"/><path d="M4 21v-1.4c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5V21Z"/>',
  smile:'<circle cx="12" cy="12" r="9"/><circle cx="8.4" cy="9" r=".6"/><circle cx="15.6" cy="9" r=".6"/><path d="M7.5 14a4.8 4.8 0 0 0 9 0"/>',
  voice:'<circle cx="12" cy="12" r="9"/><path d="M8 10v4m4-7v10m4-7v4"/>',
  wave:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><path d="M9 8a5.8 5.8 0 0 1 0 8m4-12a11.5 11.5 0 0 1 0 16"/>',
  photo:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="2"/><path d="m3 17 5-5 4 4 3-3 6 6"/>',
  camera:'<path d="M8 6 9.5 3h5L16 6h4a1 1 0 0 1 1 1v12H3V7a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12" r="4"/>',
  transfer:'<circle cx="12" cy="12" r="10"/><path d="M6 8h12l-3-3m3 11H6l3 3"/>',
  scan:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 12h18"/>',
  video:'<path d="M5 4c-2 0-3 2-3 4v8c0 2 1 4 3 4s3-2 5-5l3-6c2-3 3-5 5-5s4 2 4 4v8c0 2-2 4-4 4s-4-3-6-6L8 7C7 5 6 4 5 4Z"/>',
  live:'<path d="M4 7a8 8 0 0 0 0 10M20 7a8 8 0 0 1 0 10M7 9a5 5 0 0 0 0 6m10-6a5 5 0 0 1 0 6"/><circle cx="12" cy="12" r="2"/>',
  music:'<path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/>',
  read:'<path d="m3 10 5-6 4 6 4-6 5 6-3 9H6Z"/>',
  search:'<circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/>',
  game:'<path d="M7 7h10c3 0 5 10 3 12-2 2-4-3-6-3h-4c-2 0-4 5-6 3-2-2 0-12 3-12Z"/><path d="M6 11h5m-2.5-2.5v5m7-2h.1m2 2h.1"/>',
  mini:'<path d="M14 8V5a3 3 0 1 0-6 0v5c0 3 8 1 8 5v4a3 3 0 1 1-6 0v-3"/>',
  wallet:'<rect x="2" y="5" width="20" height="15" rx="2"/><path d="M4 5V3h15v2m3 7h-7v5h7"/><circle cx="17.5" cy="14.5" r=".6"/>',

function openDatabase(){

  });

function loadDatabase(){
  return new Promise((resolve,reject)=>{
    const tx=DB.transaction('state','readonly');
    const r=tx.objectStore('state').get('root');
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
function putDatabase(value){
  return new Promise((resolve,reject)=>{
    const tx=DB.transaction('state','readwrite');
    tx.objectStore('state').put(value,'root');
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('本地保存失败'));
    tx.onabort=()=>reject(tx.error||new Error('本地保存已取消'));
  });
}

}

/* ========= 图片处理 ========= */
function compressImage(file,{size=1280,square=false}={}){
  return new Promise((resolve,reject)=>{
    if(!/^image\/(png|jpeg)$/.test(file.type)){
      reject(new Error('只支持 PNG / JPG 图片'));return;
    }
    if(file.size>15*1024*1024){
      reject(new Error('单张图片不能超过 15MB'));return;
    }
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        if(img.width*img.height>40000000)throw new Error('图片分辨率过大，请缩小后上传');
        const canvas=document.createElement('canvas');
        const sw=square?Math.min(img.width,img.height):img.width;
        const sh=square?sw:img.height;
        const scale=Math.min(1,size/Math.max(sw,sh));
        canvas.width=Math.max(1,Math.round(sw*scale));
        canvas.height=Math.max(1,Math.round(sh*scale));
        const ctx=canvas.getContext('2d');
        if(!ctx)throw new Error('浏览器无法处理图片');
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,
          sw,sh,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',.82));
      }catch(e){reject(e)}
      finally{URL.revokeObjectURL(url)}
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);reject(new Error('无法读取图片'));
    };
    img.src=url;
  });
}
function pickImages(max,options,callback){
  const input=document.createElement('input');
  input.type='file';input.accept='image/png,image/jpeg';
  input.multiple=max>1;input.hidden=true;
  document.body.append(input);
  input.oncancel=()=>input.remove();
  input.onchange=async()=>{
    const files=[...input.files];
    input.remove();
    if(!files.length)return;
    if(files.length>max){toast('最多选择 '+max+' 张图片');return}
    try{
      toast('正在处理图片…');
      const images=[];
      for(const file of files)images.push(await compressImage(file,options));
      await callback(images);
    }catch(e){fail(e)}
  };
  input.click();
}

    const next={

    };
    if(next.voiceOn&&!next.voiceId)throw new Error('启用语音回复前请填写 voice_id');
    await change(d=>{
      let target=d.contacts.find(x=>x.id===c.id);

      }
      if(next.autoPost&&(!target.autoPost||next.postMinutes!==target.postMinutes)){
        target.nextPost=Date.now()+next.postMinutes*60000;
      }
      if((next.autoLike&&!target.autoLike)||(next.autoComment&&!target.autoComment)){
        target.reactSince=Date.now();

      Object.assign(target,next);
    });
    render();

        });

      }catch(e){fail(e)}
    };
  }

/* ========= API：文字 / 图片 / 流式 ========= */
function apiMessage(m,cfg=S.cfg){
  const kind=m.kind||'text';
  let text=m.content||'';
  if(m.role==='user'){
    if(kind==='voice')text='【用户发送的语音消息，以下是转写文字】\n'+(m.text||text);
    if(kind==='picture-description')text='【用户发送了一张模拟照片；以下是画面描述，不是真实图像】\n'+(m.text||text);
    if(kind==='transfer')text='【模拟转账，不涉及真实付款】人民币 '+m.amount+' 元；备注：'+(m.text||'无');
    if(kind==='photo'||kind==='sticker'){
      text=(kind==='sticker'?'【用户发送表情图片】':'【用户发送照片】')+
        (m.text?'\n附言：'+m.text:'');
      if(cfg.vision&&m.image){
        return {role:'user',content:[
          {type:'text',text},
          {type:'image_url',image_url:{url:m.image}}
        ]};
      }
      text+='\n当前请求未附图片数据，请不要猜测图片内容。';
    }
  }
  return {role:m.role,content:text};
}
function systemFor(c){
  return c.persona+
    '\n\n当前用户昵称：'+S.profile.name+
    '\n这是私人的模拟社交聊天。语音转写、照片描述和模拟转账会有明确标记。'+
    '请按消息类型自然回应，不要声称发生了真实付款或真实线下行为。';
}
async function requestAI(c,history,system,onUpdate){
  const cfg=clone(S.cfg);
  if(!cfg.apiKey)throw new Error('请先在“我 → 设置”填写 API Key');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),120000);
  const body={
    model:cfg.model,stream:!!onUpdate,
    messages:[{role:'system',content:system},...history]
  };
  if(!cfg.omitTemperature){
    body.temperature=Number((clamp(c.temperature,0,10)/10*Number(cfg.temperatureMax)).toFixed(2));
  }
  try{
    const res=await fetch(validateBase(cfg.baseUrl)+'/chat/completions',{
      method:'POST',signal:controller.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const raw=await res.text();
      let reason=raw.slice(0,300);
      try{
        const j=JSON.parse(raw);
        reason=j.error?.message||j.message||reason;
      }catch(_){}
      throw new Error('聊天接口 HTTP '+res.status+'：'+reason);
    }
    if((res.headers.get('content-type')||'').includes('application/json')||!onUpdate){
      const j=await res.json();
      if(j.error)throw new Error(j.error.message||'接口返回错误');
      const text=j.choices?.[0]?.message?.content;
      if(typeof text!=='string'||!text.trim())throw new Error('接口没有返回文字内容');
      onUpdate?.(text);
      return text.trim();
    }
    if(!res.body)throw new Error('浏览器没有收到响应流');
    const reader=res.body.getReader(),decoder=new TextDecoder();
    let buffer='',full='',finished=false;
    const line=raw=>{
      const s=raw.trim();
      if(!s.startsWith('data:'))return;
      const data=s.slice(5).trim();
      if(!data)return;
      if(data==='[DONE]'){finished=true;return}
      let j;
      try{j=JSON.parse(data)}catch(_){return}
      if(j.error)throw new Error(j.error.message||'流式接口错误');
      const delta=j.choices?.[0]?.delta?.content;
      if(typeof delta==='string'){
        full+=delta;onUpdate(full);
      }
    };
    while(!finished){
      const {done,value}=await reader.read();
      buffer+=done?decoder.decode():decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');buffer=lines.pop();
      lines.forEach(line);
      if(done){if(buffer.trim())line(buffer);break}
    }
    if(finished)await reader.cancel().catch(()=>{});
    if(!full.trim())throw new Error('对方没有回复内容');
    return full.trim();
  }finally{clearTimeout(timer)}
}
/* ========= 聊天气泡与发送 ========= */
function messageHTML(m,c){
  const mine=m.role==='user';
  const person=mine?who('me'):who(c.id);
  const kind=m.kind||(m.voice?'voice':'text');
  const text=m.text||m.content||'';
  const start='<div class="row '+(mine?'me':'')+'" data-message="'+esc(m.id)+'">'+avatar(person,mine);
  if(kind==='photo'||kind==='sticker'){
    return start+'<img class="msg-photo" src="'+esc(imageURL(m.image))+'" alt="'+esc(kind==='sticker'?'表情':'照片')+'" data-image></div>'+
      (m.text?'<div class="photo-caption">'+esc(m.text)+'</div>':'');
  }
  if(kind==='picture-description'){
    return start+'<div class="fake-photo"><small>照片 · 文字模拟</small>'+
      esc(text)+'</div></div>';
  }
  if(kind==='transfer'){
    return start+'<div class="transfer"><div class="transfer-main">'+icon('transfer')+
      '<div><div class="transfer-money">¥'+esc(m.amount)+'</div>'+
      '<div class="transfer-note">'+esc(m.text||'转账给你')+'</div></div></div>'+
      '<div class="transfer-foot">转账 · 模拟</div></div></div>';
  }
  if(kind==='voice'){
    return start+
      '<div class="voice-wrap"><button class="bubble voice-btn" data-voice="'+esc(m.id)+'">'+
      icon('wave')+'<span class="voice-label">'+(mine?'语音转写':'语音')+'</span></button>'+
      '<div class="voice-text" '+(expandedVoices.has(m.id)?'':'hidden')+'>'+esc(text)+'</div>'+
      '<div class="voice-hint">可按住 转文字</div></div></div>';
  }
  if(mine)return start+'<div class="bubble">'+esc(m.content)+'</div></div>';
  return m.content.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(t=>
    start+'<div class="bubble">'+esc(t)+'</div></div>').join('');
}
function renderChat(){
  const c=contact(currentId);
  if(!c){navigate('wechat');return}
  header(pending.has(c.id)?'对方正在输入…':c.aiName,
    'back','more',()=>navigate('wechat'),chatMenu);
  const list=messages(c.id);
  let lastTime=0;
  view.innerHTML=list.map(m=>{
    let t='';
    if(m.time&&(!lastTime||m.time-lastTime>300000)){
      t='<div class="msg-time">'+esc(dateText(m.time))+'</div>';
      lastTime=m.time;
    }
    return t+messageHTML(m,c);
  }).join('');
  if(pending.has(c.id)){
    view.innerHTML+='<div class="row">'+avatar(who(c.id))+
      '<div class="bubble" id="streamText">'+esc(pending.get(c.id).text||'…')+'</div></div>';
  }
  if(chatErrors.has(c.id)){
    const n=document.createElement('div');
    n.className='notice error-note';
    n.textContent=chatErrors.get(c.id);
    view.append(n);
  }
  $('input').value=drafts.get(c.id)||'';
  syncComposer();
  bindMessageActions(c);
  view.scrollTop=view.scrollHeight;
}
function bindMessageActions(c){
  view.querySelectorAll('[data-image]').forEach(img=>{
    img.onclick=()=>showImage(img.src);
  });
  view.querySelectorAll('[data-voice]').forEach(btn=>{
    const m=messages(c.id).find(x=>x.id===btn.dataset.voice);
    if(!m)return;
    let timer=null,held=false;
    const expand=()=>{
      expandedVoices.add(m.id);
      btn.parentElement.querySelector('.voice-text').hidden=false;
    };
    const menu=()=>{
      const body=modal('语音消息',
        '<button class="wide-btn" id="transcribeBtn">转文字</button>'+
        '<p class="hint">'+
        (m.role==='user'?'这是你输入文字生成的模拟语音消息，没有麦克风录音。':'点击语音条使用 MiniMax 合成播放。')+
        '</p>');
      body.querySelector('#transcribeBtn').onclick=()=>{expand();closeModal()};
    };
    btn.onpointerdown=()=>{
      held=false;
      timer=setTimeout(()=>{held=true;menu()},550);
    };
    const clear=()=>clearTimeout(timer);
    btn.onpointerup=clear;btn.onpointercancel=clear;btn.onpointerleave=clear;
    btn.oncontextmenu=e=>{e.preventDefault();held=true;clear();menu()};
    btn.onclick=()=>{
      if(held){held=false;return}
      if(m.role==='user')return expand();
      playVoice(m,c,btn).catch(fail);
    };
  });
}
function syncComposer(){
  const text=$('input').value;
  $('sendBtn').hidden=!text.trim();
  $('plusBtn').hidden=!!text.trim();
  $('sendBtn').disabled=pending.has(currentId);
  $('input').style.height='auto';
  $('input').style.height=Math.min($('input').scrollHeight,120)+'px';
}
$('input').oninput=()=>{
  drafts.set(currentId,$('input').value);
  syncComposer();
};
$('input').onfocus=()=>$('tray').hidden=true;
$('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();sendText();
  }
});
$('sendBtn').onclick=sendText;
async function sendText(){
  const text=$('input').value.trim();
  if(text)await sendMessage({kind:'text',content:text},true);
}
async function sendMessage(data,clearDraft=false,retry=false){
  const id=currentId,c=contact(id);
  if(page!=='chat'||!c)return;
  if(pending.has(id))return toast('对方正在回复，请稍等');
  if(!S.cfg.apiKey)return toast('请在“我 → 设置”填写聊天 API Key');
  const originalDraft=$('input').value;
  const state={text:''};
  pending.set(id,state);
  chatErrors.delete(id);
  syncComposer();
  try{
    if(!retry){
      const m={id:uid(),role:'user',time:Date.now(),...data};
      await change(d=>{
        if(!d.contacts.some(x=>x.id===id))throw new Error('联系人已不存在');
        (d.chats[id] ||= []).push(m);
      });
      if(clearDraft&&drafts.get(id)===originalDraft){
        drafts.set(id,'');
      }
    }
    $('tray').hidden=true;
    if(page==='chat'&&currentId===id)renderChat();
    const history=messages(id).slice(-Math.max(2,c.memory)).map(m=>apiMessage(m));
    const full=await requestAI(c,history,systemFor(c),text=>{
      state.text=text;
      if(page==='chat'&&currentId===id){
        const el=$('streamText');
        if(el){
          const nearBottom=view.scrollHeight-view.scrollTop-view.clientHeight<150;
          el.textContent=text;
          if(nearBottom)view.scrollTop=view.scrollHeight;
        }
      }
    });
    const ai={
      id:uid(),role:'assistant',content:full,time:Date.now(),
      kind:c.voiceOn?'voice':'text',voiceId:c.voiceId
    };
    try{
      await change(d=>{
        if(!d.contacts.some(x=>x.id===id))return;
        (d.chats[id] ||= []).push(ai);
      });
    }catch(e){
      modal('回复未能保存',
        '<p class="hint">本地保存失败。请先复制这条回复，避免关闭页面后丢失。</p>'+
        '<textarea rows="8" readonly>'+esc(full)+'</textarea>');
      throw e;
    }
  }catch(e){
    chatErrors.set(id,'发送提示：'+errorText(e)+'。可在右上角菜单重试。');
    if(page!=='chat'||currentId!==id)fail(e);
  }finally{
    pending.delete(id);
    if((page==='chat'&&currentId===id)||page==='wechat')render();
  }
}
function chatMenu(){
  const c=contact(currentId);
  const body=modal('聊天信息',
    '<button class="wide-btn" id="searchChat">查找聊天记录</button>'+
    '<button class="wide-btn" id="pinChat">置顶聊天：'+(c.pinned?'已开启':'未开启')+'</button>'+
    '<button class="wide-btn" id="retryChat">重试上次未回复消息</button>'+
    '<button class="wide-btn danger" id="clearChat">清空当前聊天记录</button>');
  body.querySelector('#searchChat').onclick=searchChat;
  body.querySelector('#pinChat').onclick=async()=>{
    try{
      await change(d=>{const x=d.contacts.find(x=>x.id===c.id);if(x)x.pinned=!x.pinned});
      closeModal();toast('置顶设置已更新');
    }catch(e){fail(e)}
  };
  body.querySelector('#retryChat').onclick=()=>{
    const last=messages(c.id).at(-1);
    if(!last||last.role!=='user')return toast('没有等待重试的用户消息');
    closeModal();sendMessage(null,false,true);
  };
  body.querySelector('#clearChat').onclick=async()=>{
    if(pending.has(c.id))return toast('请等当前回复结束再清空');
    if(!confirm('确定清空当前联系人聊天记录？'))return;
    try{
      await change(d=>d.chats[c.id]=[]);
      chatErrors.delete(c.id);stopAudio();closeModal();render();
    }catch(e){fail(e)}
  };
}
function searchChat(){
  const c=contact(currentId);
  const body=modal('查找聊天记录',
    '<input id="searchInput" type="search" placeholder="文字、语音转写、照片描述或金额">'+
    '<div id="searchResults"></div>');
  body.querySelector('input').oninput=e=>{
    const term=e.target.value.trim().toLowerCase();
    const hits=term?messages(c.id).filter(m=>
      [m.content,m.text,m.amount].join(' ').toLowerCase().includes(term)): [];
    const results=body.querySelector('#searchResults');
    results.innerHTML=hits.slice().reverse().map(m=>
      '<button class="search-hit" data-hit="'+esc(m.id)+'"><small>'+
      esc(m.role==='user'?S.profile.name:c.aiName)+' · '+esc(dateText(m.time))+
      '</small><span>'+esc(m.text||m.content||previewText(m))+'</span></button>').join('')+
      (term&&!hits.length?'<p class="hint">没有找到相关记录。</p>':'');
    results.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.hit;
      closeModal();renderChat();
      const target=[...view.querySelectorAll('[data-message]')].find(n=>n.dataset.message===id);
      if(target){
        target.scrollIntoView({behavior:'smooth',block:'center'});
        target.classList.add('highlight');
      }
    });
  };
}

/* ========= MiniMax 语音与长按转文字 ========= */
const audioCache=new Map();
let currentAudio=null,currentVoiceButton=null,audioToken=0;
function stopAudio(){
  audioToken++;
  if(currentAudio)currentAudio.pause();
  if(currentVoiceButton)currentVoiceButton.classList.remove('playing');
  currentAudio=null;currentVoiceButton=null;
}
function clearAudioCache(){
  stopAudio();
  for(const url of audioCache.values())URL.revokeObjectURL(url);
  audioCache.clear();
}
async function synthesize(text,voiceId){
  const cfg=clone(S.cfg);
  if(!cfg.mmKey)throw new Error('请先在“我 → 设置”填写 MiniMax API Key');
  if(!voiceId)throw new Error('请在通讯录中设置该联系人的 voice_id');
  if(text.length>=10000)throw new Error('这条语音文本过长，请改用文字查看');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),90000);
  try{
    let url=validateBase(cfg.mmBase)+'/t2a_v2';
    if(cfg.mmGroupId)url+='?GroupId='+encodeURIComponent(cfg.mmGroupId);
    const res=await fetch(url,{
      method:'POST',signal:controller.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.mmKey},
      body:JSON.stringify({
        model:cfg.mmModel,text,stream:false,output_format:'hex',
        voice_setting:{voice_id:voiceId,speed:1,vol:1,pitch:0},
        audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}
      })
    });
    if(!res.ok)throw new Error('MiniMax HTTP '+res.status);
    const j=await res.json();
    if(j.base_resp&&Number(j.base_resp.status_code)!==0){
      throw new Error(j.base_resp.status_msg||'MiniMax 合成失败');
    }
    const hex=j.data?.audio;
    if(typeof hex!=='string'||!hex.length||hex.length%2||!/^[0-9a-f]+$/i.test(hex)){
      throw new Error('MiniMax 未返回有效的十六进制音频');
    }
    const bytes=new Uint8Array(hex.length/2);
    for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(hex.slice(i*2,i*2+2),16);
    return URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));
  }finally{clearTimeout(timer)}
}
async function playVoice(m,c,button){
  if(currentVoiceButton===button){stopAudio();return}
  stopAudio();
  const token=audioToken,voiceId=m.voiceId||c.voiceId;
  const key=[S.cfg.mmBase,S.cfg.mmModel,voiceId,m.content].join('|');
  currentVoiceButton=button;
  button.classList.add('playing');
  try{
    let url=audioCache.get(key);
    if(!url){
      toast('正在合成语音…');
      url=await synthesize(m.content,voiceId);
      if(token!==audioToken){URL.revokeObjectURL(url);return}
      if(audioCache.size>=20){
        const first=audioCache.keys().next().value;
        URL.revokeObjectURL(audioCache.get(first));audioCache.delete(first);
      }
      audioCache.set(key,url);
    }
    if(token!==audioToken)return;
    const audio=new Audio(url);
    currentAudio=audio;
    audio.onloadedmetadata=()=>{
      if(Number.isFinite(audio.duration)&&button.isConnected){
        button.querySelector('.voice-label').textContent=Math.ceil(audio.duration)+'″';
      }
    };
    audio.onended=()=>{if(currentAudio===audio)stopAudio()};
    audio.onerror=()=>{
      if(currentAudio===audio){stopAudio();toast('音频播放失败，请重试')}
    };
    await audio.play();
  }catch(e){
    if(token===audioToken){
      stopAudio();
      if(e.name==='NotAllowedError')toast('浏览器阻止了自动播放，请再点一次语音条。');
      else throw e;
    }
  }
}

  await change(d=>{
    if(Date.now()-d.autoUsage.start>=3600000){

async function generateMoment(id,automatic){
  if(socialBusy){
    if(!automatic)toast('正在处理另一项朋友圈任务，请稍后');
    return;
  }
  const original=contact(id);
  if(!original)return;
  if(!S.cfg.apiKey){if(!automatic)toast('请先填写聊天 API Key');return}
  const c=clone(original);
  socialBusy=true;
  try{
    if(automatic&&!await claimAutoCall())return;
    await change(d=>{
      const x=d.contacts.find(x=>x.id===id);
      if(x)x.nextPost=Date.now()+x.postMinutes*60000;
    });
    setSocialStatus(c.aiName+'正在准备朋友圈…');
    const own=S.moments.filter(p=>p.author.id===id).slice(-4).map(p=>p.text);
    const prompt=
      '请以你的人设写一条新的朋友圈，仅输出正文，20～120字。'+
      '像日常随手分享，避免重复旧动态；不加“朋友圈文案”等标题。'+
      '这是虚构角色动态，不要声称真实完成了付款或外部操作。\n'+

      '\n你与用户的近期聊天：\n'+recentConversation(c)+
      '\n你最近发过的动态：'+JSON.stringify(own);
    const text=await requestAI(c,[{role:'user',content:prompt}],systemFor(c));
    const p={
      id:uid(),author:{id:c.id,name:c.aiName,avatar:c.aiAvatar},
      text:text.slice(0,600),images:[],time:Date.now(),
      likes:[],comments:[],handled:[]

      d.moments.push(p);posted=true;

    setSocialStatus(posted?c.aiName+'刚刚更新了朋友圈':'任务已取消');
    refreshSocial();
    if(!automatic&&posted)toast('已发布到朋友圈');

async function reactToMoment(id,postId){
  if(socialBusy)return;
  const original=contact(id),source=S.moments.find(x=>x.id===postId);
  if(!original||!source)return;
  const c=clone(original),p=clone(source);
  const job=id+':'+postId;
  socialBusy=true;
  try{
    if(!await claimAutoCall())return;
    retryAfter.set(job,Date.now()+300000);
    setSocialStatus(c.aiName+'正在看朋友圈…');
    const instruction=
      '根据人设判断是否对用户的新朋友圈点赞、评论。'+
      '只输出 JSON，不要 Markdown，格式：{"like":true,"comment":"评论内容"}。'+
      '不想点赞就 like:false；不想评论就 comment:""。评论最多80字。'+
      '\n允许点赞：'+c.autoLike+'；允许评论：'+c.autoComment+
      '\n用户动态文字：'+JSON.stringify(p.text)+
      '\n已有评论：'+JSON.stringify(p.comments.map(x=>({
        name:livePerson(x.author).name,text:x.text
      })).slice(-8))+
      '\n你与用户的近期聊天：\n'+recentConversation(c)+
      (!S.cfg.vision&&p.images.length?'\n这条动态有图片，但本次没有提供图像，不要猜测图片画面。':'');
    let content=instruction;
    if(S.cfg.vision&&p.images.length){
      content=[{type:'text',text:instruction},
        ...p.images.map(src=>({type:'image_url',image_url:{url:src}}))];
    }
    const raw=await requestAI(c,[{role:'user',content}],systemFor(c));
    const cleaned=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
    const answer=JSON.parse(cleaned);
    if(typeof answer.like!=='boolean'||typeof answer.comment!=='string'){
      throw new Error('AI 返回的互动格式不正确，本次未添加点赞或评论');
    }
    await change(d=>{
      const live=d.contacts.find(x=>x.id===id);
      const post=d.moments.find(x=>x.id===postId);
      if(!live||!post||!d.cfg.automation||post.handled.includes(id))return;
      if(!live.autoLike&&!live.autoComment)return;
      const author={id:live.id,name:live.aiName,avatar:live.aiAvatar};
      if(live.autoLike&&c.autoLike&&answer.like&&!post.likes.some(x=>x.id===id)){
        post.likes.push(author);
      }
      if(live.autoComment&&c.autoComment&&answer.comment.trim()){
        post.comments.push({
          id:uid(),author,text:answer.comment.trim().slice(0,160),time:Date.now()
        });
      }
      post.handled.push(id);
    });
    setSocialStatus('朋友圈互动已更新');
    refreshSocial();
  }catch(e){
    setSocialStatus('自动互动失败，稍后重试：'+errorText(e));
  }finally{socialBusy=false}
}
async function autoTick(){
  if(!S||socialBusy||document.hidden||!S.cfg.automation||!S.cfg.apiKey)return;
  const now=Date.now();
  if(now-S.autoUsage.start<3600000&&S.autoUsage.count>=S.cfg.hourlyLimit)return;
  // 每次只执行一个任务，不补发离线期间错过的大量动态。
  const due=S.contacts.find(c=>c.autoPost&&c.nextPost&&c.nextPost<=now);
  if(due)return generateMoment(due.id,true);
  const recent=S.moments.filter(p=>
    p.author.id==='me'&&now-p.time<86400000).slice().reverse();
  for(const p of recent){
    for(const c of S.contacts){
      if(!(c.autoLike||c.autoComment)||p.time<c.reactSince)continue;
      if(p.handled.includes(c.id))continue;
      if((retryAfter.get(c.id+':'+p.id)||0)>now)continue;
      return reactToMoment(c.id,p.id);
    }
  }
}
/* ========= 启动 ========= */
async function init(){
  DB=await openDatabase();
  S=await loadDatabase();
  if(!S){
    S=migrateOld();
    await putDatabase(S);
  }
  if(S.version!==4)throw new Error('本地数据版本不匹配，请不要直接清理旧记录');
  render();
  setInterval(()=>autoTick().catch(fail),15000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)stopAudio();
    else autoTick().catch(fail);
  });
  setTimeout(()=>autoTick().catch(fail),4000);
}
init().catch(e=>{
  view.innerHTML='<div class="empty">启动失败：'+esc(errorText(e))+
    '<br><br>旧版记录没有被删除。请允许浏览器本地存储，并尝试使用固定地址打开此页面。</div>';
});
</script>
