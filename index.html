  actions.wxDeleteMessage = async function(id) {
    if (!needIdle()) return;

    const { t, m } = findMessage(id);
    if (!t || !m) return;

    const transactionMessage =
      m.kind === 'transfer' || m.kind === 'ledger';

    const explanation = transactionMessage
      ? '删除这张消息卡片？\n\n' +
        '只删除聊天里的显示和后续上下文，不会撤销已发生的模拟转账、改变余额或删除账单。' +
        '\n未确认的卡片删除后，将无法再从这条消息确认。'
      : '删除这条消息？\n\n' +
        '它将从聊天记录和后续 AI 上下文中移除，不留下撤回提示。' +
        '\n操作无法直接撤销，已收藏的副本仍然保留。';

    if (!confirm(explanation)) return;

    const index = t.messages.findIndex(item => item.id === id);
    if (index < 0) return;

    const oldMemories = t.memory.items;

    // 防止正在播放已删除消息的语音。
    stopAudio();

    t.messages.splice(index, 1);

    /*
     * 移除直接引用该消息的自动记忆，
     * 避免刚删掉的消息仍通过这类摘要参与聊天。
     * 手动记忆不自动删除。
     */
    invalidateMemories(t, m);

    const saved = await save();

    if (!saved) {
      t.messages.splice(index, 0, m);
      t.memory.items = oldMemories;
      refreshThread(t);

      throw new Error(
        '删除未能保存，消息已恢复。请检查浏览器存储空间。'
      );
    }

    closeModal();
    refreshThread(t);
    toast('消息已删除');
  };

  /* ====================================
     重新生成选中的 AI 气泡
     ==================================== */
  actions.wxRegenerateMessage = async function(id) {
    if (!needIdle() || !requireAPI()) return;

    const { t, m } = findMessage(id);

    if (!t || !canRegenerate(m)) {
      toast('只能重新生成仍有关联联系人的 AI 文字或语音消息');
      return;
    }

    if (!confirm(
      '重新生成选中的这一个回复气泡？\n\n' +
      '将参考它之前的聊天，成功后替换原文。' +
      '\n它后面的消息不会一起重写。' +
      '\n本次会调用聊天 API；失败时保留原消息。'
    )) {
      return;
    }

    closeModal();
    stopAudio();

    await task(async () => {
      activeThread = t.id;

      const actor = C(m.author);
      const index = t.messages.findIndex(item => item.id === id);

      if (!actor || index < 0 || m.revoked) {
        throw new Error('原消息或对应联系人已不存在');
      }

      /*
       * 创建临时上下文：
       * 只保留目标消息之前的聊天。
       * 不删除真实记录，也不再次添加用户消息。
       */
      const contextThread = clone(t);
      contextThread.messages = clone(t.messages.slice(0, index));

      // 使用原消息所在的线上／线下模式。
      contextThread.mode = m.mode === 'offline'
        ? 'offline'
        : 'online';

      /*
       * 不把包含目标消息或其后续消息的自动摘要，
       * 带回本次重新生成，减少旧答案的干扰。
       * 手动记忆及用户允许的跨聊天共享仍按原设置使用。
       */
      const excludedIds = new Set(
        t.messages.slice(index).map(item => item.id)
      );

      contextThread.memory.items =
        contextThread.memory.items.filter(memory => {
          if (!memory.auto) return true;

          const sources = Array.isArray(memory.sources)
            ? memory.sources
            : [];

          return !sources.some(sourceId =>
            excludedIds.has(sourceId)
          );
        });

      const messages = buildMessages(contextThread, actor);

      const instruction = [
        '【本次任务：重新生成一个 AI 回复气泡】',
        '请根据前面的聊天继续回复，保持当前联系人的人设和聊天模式。',
        '只输出你自己的这一条回复正文，不代替用户发言。',
        '不要解释重新生成的过程，不要写“重新生成如下”。',
        '本次只替换一个文字或语音气泡。',
        '不要输出 <action> 标签，不发起转账或记账动作。'
      ].join('\n');

      /*
       * 加入当前请求的任务要求，
       * 不修改永久人设或世界书。
       */
      const systemMessage = messages.find(message =>
        message.role === 'system' &&
        typeof message.content === 'string'
      );

      if (systemMessage) {
        systemMessage.content += '\n\n' + instruction;
      } else {
        messages.unshift({
          role: 'system',
          content: instruction
        });
      }

      toast('正在重新生成，原消息暂时保留…');

      /*
       * 非流式请求，拿到完整内容后才替换。
       * 原有 requestAI 补丁仍然生效，
       * 包括现实时间开关和 GIF 图片处理。
       */
      const raw = await requestAI(
        messages,
        t.temperature,
        null
      );

      const parsed = parseReply(raw);
      const newText = parsed.text.trim();

      if (!newText) {
        throw new Error('AI 没有返回有效正文，原消息未修改');
      }

      /*
       * 请求期间用户可以切换页面，
       * 因此始终按原聊天和消息 ID 定位，
       * 不用当前打开的聊天替代目标。
       */
      const liveThread = T(t.id);
      const liveMessage = liveThread?.messages.find(
        item => item.id === id
      );

      if (
        liveThread !== t ||
        liveMessage !== m ||
        m.revoked
      ) {
        throw new Error('原消息已发生变化，本次结果未写入');
      }

      const previous = {
        text: m.text,
        edited: m.edited,
        hadEdited: Object.prototype.hasOwnProperty.call(m, 'edited'),
        audio: m.audio,
        hadAudio: Object.prototype.hasOwnProperty.call(m, 'audio'),
        memories: t.memory.items
      };

      /*
       * 保留原消息 ID、发送人、位置、种类和时间。
       * 语音消息清掉旧音频，下次点击按新文本合成。
       */
      m.text = newText;
      m.edited = true;
      delete m.audio;

      invalidateMemories(t, m);

      const saved = await save();

      if (!saved) {
        m.text = previous.text;

        if (previous.hadEdited) {
          m.edited = previous.edited;
        } else {
          delete m.edited;
        }

        if (previous.hadAudio) {
          m.audio = previous.audio;
        } else {
          delete m.audio;
        }

        t.memory.items = previous.memories;

        refreshThread(t);

        throw new Error(
          '新回复未能保存，已恢复原消息和原音频'
        );
      }

      refreshThread(t);
      toast('已替换这条回复');
    });
  };

})();
</script>
